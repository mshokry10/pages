@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>

<header class="topbar"><div class="shell top-inner">

</div></header>

<script>
(function(){
"use strict";
var SOURCE_SHEET="https://docs.google.com/spreadsheets/d/1i2gxx3dNMdbsgtMD-A9N6DzcQhkNJ6hKjMV3lwZNsa0/edit";
var state={data:null,page:"overview",model:"",query:"",sort:"recommended",budget:20999,miles:50000,onlyApproved:false,excluded:false,modelFilter:"",limit:24,comparison:[]};
var root=document.getElementById("app");
function esc(v){return String(v===null||v===undefined?"":v).replace(/[&<>"']/g,function(a){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]})}
function money(n){return n===null||!Number.isFinite(Number(n))?"—":new Intl.NumberFormat("en-GB",{style:"currency",currency:"GBP",maximumFractionDigits:0}).format(Number(n))}
function miles(n){return n===null||!Number.isFinite(Number(n))?"—":new Intl.NumberFormat("en-GB").format(Number(n))+" mi"}
function safeUrl(url){return /^https:\/\/[a-z0-9.-]+(?:\/|$)/i.test(url||"")?url:""}
function all(){return(state.data?.models||[]).flatMap(function(m){return m.listings.map(function(a){return a})})}
function eligible(a){return !/^EXCLUDED\b/i.test(a.priority||"")&&a.price!==null&&a.price<21000&&a.mileage!==null&&a.mileage<=50000}
function chosen(a){return state.comparison.indexOf(a.model+"|"+a.id)>=0}
function getKey(a){return a.model+"|"+a.id}
function metric(a,label,key){return '<div><small>'+label+'</small><span title="'+esc(a[key])+'">'+esc(a[key]||"Not verified")+'</span></div>'}
function status(m){if(!m.overview?.stage)return"Unresearched";return m.overview.stage.startsWith("Deep")?"Researched":m.overview.stage.startsWith("Seeded")?"Seeded":"Pending"}
function statusClass(s){return s==="Researched"?"green":s==="Seeded"?"blue":"amber"}
function allEligible(){return all().filter(eligible)}
function totals(){var eligibleCount=allEligible().length;var ex=all().length-eligibleCount;return{eligible:eligibleCount,excluded:ex}}
function selectedFor(m){return m.listings.find(function(a){return a.selected})||m.listings.find(eligible)}
function clamp(t,n){return t.length>n?t.slice(0,n-1)+"…":t}
function badge(t,c){return'<span class="badge '+(c||"")+'">'+esc(t)+'</span>'}
function hero(){var total=totals();return'<section class="hero"><div class="hero-copy"><div class="eyebrow">Your UK used-EV buying dashboard</div><h1>Cheap Car<br>Comparisons.</h1><p>Real electric SUV listings, compared by the features that matter. The data comes from our car research spreadsheet, with no guesswork about which advert belongs to which trim.</p><div class="hero-chips"><span>Under £21,000</span><span>Up to 50,000 miles</span><span>23 EV models</span><span>Read-only sheet snapshot</span></div></div><div class="hero-art" aria-hidden="true"><svg viewBox="0 0 440 250" fill="none"><ellipse cx="235" cy="207" rx="174" ry="19" fill="#568BE0" opacity=".18"/><path d="M46 165 L77 142 L119 103 C138 87 168 76 215 76 H294 C312 77 329 89 341 107 L379 143 L401 153 Q415 160 414 178 V197 H32 V178 Q30 170 46 165Z" stroke="#91C2FF" stroke-width="3"/><path d="M124 104 C150 87 175 83 210 83 H280 L314 143 H85Z" stroke="#91C2FF" stroke-width="2"/><path d="M226 85 V142 M347 149 H398 M53 164 H96 M101 151 H331" stroke="#91C2FF" stroke-width="2"/><circle cx="112" cy="195" r="31" fill="#112440" stroke="#91C2FF" stroke-width="3"/><circle cx="340" cy="195" r="31" fill="#112440" stroke="#91C2FF" stroke-width="3"/><circle cx="112" cy="195" r="14" stroke="#91C2FF" stroke-width="2"/><circle cx="340" cy="195" r="14" stroke="#91C2FF" stroke-width="2"/></svg></div></section>'+
'<section class="stats"><div class="stat"><small>Within our listing limits</small><strong>'+total.eligible+'</strong><span>Adverts saved from the sheet</span></div><div class="stat"><small>EV models compared</small><strong>'+state.data.models.length+'</strong><span>Across the UK market</span></div><div class="stat"><small>Deep-search completed</small><strong>'+state.data.models.filter(function(x){return status(x)==="Researched"}).length+'</strong><span>Evidence-backed model research</span></div><div class="stat"><small>Target cash budget</small><strong>£21k</strong><span>Excludes '+total.excluded+' out-of-limits watchlist ads</span></div></section>'}
function pickCard(m,i){var a=selectedFor(m);if(!a)return"";return'<article class="pickcard"><div class="rank"><span class="kicker">Notable match</span>'+badge("From sheet","blue")+'</div><h3>'+esc(m.name)+'</h3><div class="trimline">'+esc(a.year+" · "+a.trim)+'</div><div class="pickprice">'+money(a.price)+'</div><div class="pickmi">'+miles(a.mileage)+' · '+esc(a.seller||"Seller unverified")+'</div><div class="push"><button type="button" class="btn secondary sm" data-model="'+esc(m.name)+'">Explore listings →</button></div></article>'}
function modelCard(m){var ov=m.overview||{};var count=m.listings.filter(eligible).length;var s=status(m);return'<article class="modelcard" role="button" tabindex="0" data-model="'+esc(m.name)+'"><div class="model-top"><div><span class="kicker">Electric SUV</span><h3>'+esc(m.name)+'</h3></div>'+badge(s,statusClass(s))+'</div><p>'+esc(clamp(ov.fit||"Not deeply researched yet",99))+'</p><div class="model-bottom"><div class="pricecell"><small>Lowest price</small><b>'+money(ov.lowestPrice)+'</b></div><div class="pricecell"><small>Best-match price</small><b class="blue">'+money(ov.bestPrice)+'</b></div><div class="pricecell"><small>Adverts</small><b>'+count+'</b></div></div></article>'}
function overviewPage(){var preferred=["Nissan Ariya","VW ID.4","Volvo XC40 Recharge","Ford Mustang Mach-E"];var picks=preferred.map(function(n){return state.data.models.find(function(m){return m.name===n})}).filter(Boolean);return hero()+'<section class="section"><div class="sectionhead"><div><h2>Where I would start</h2><p>Selected variants worth investigating first, not guarantees that every required feature is verified.</p></div><button class="actionlink" type="button" data-nav="listings">See every advert →</button></div><div class="picks">'+picks.map(pickCard).join("")+'</div></section><section class="section"><div class="sectionhead"><div><h2>All '+state.data.models.length+' models</h2><p>Best-match price is different from the absolute cheapest listing.</p></div>'+badge("10 thoroughly researched","blue")+'</div><div class="cardgrid">'+state.data.models.map(modelCard).join("")+'</div></section><div class="warnbox">Prices and equipment are taken from saved research adverts, not live dealer quotes. A model can be listed here even when no individual vehicle passes all your preferences. Always check the actual car, history, equipment packs, total price and stock with the seller.</div>'}
function listingControls(scope){var o='<option value="">All models</option>'+state.data.models.map(function(x){return'<option value="'+esc(x.name)+'"'+(state.modelFilter===x.name?' selected':'')+'>'+esc(x.name)+'</option>'}).join("");
return'<div class="toolbar"><div class="field search"><span aria-hidden="true">⌕</span><input id="searchBox" type="search" placeholder="Search trims, models, dealers, equipment…" aria-label="Search listings" value="'+esc(state.query)+'"></div>'+
(scope==="all"?'<div class="field"><label for="modelPicker">Model</label><select id="modelPicker">'+o+'</select></div>':"")+
'<div class="field"><label for="sortPicker">Sort</label><select id="sortPicker"><option value="recommended"'+(state.sort==="recommended"?" selected":"")+'>Best match</option><option value="price"'+(state.sort==="price"?" selected":"")+'>Lowest price</option><option value="miles"'+(state.sort==="miles"?" selected":"")+'>Lowest miles</option><option value="newest"'+(state.sort==="newest"?" selected":"")+'>Newest year</option><option value="range"'+(state.sort==="range"?" selected":"")+'>Most WLTP</option></select></div>'+
'<div class="field"><label for="maxPrice">Max £</label><select id="maxPrice">'+[16000,18000,19000,20000,20999].map(function(n){return'<option value="'+n+'"'+(state.budget===n?' selected':'')+'>'+money(n)+'</option>'}).join("")+'</select></div>'+
'<div class="field"><label for="maxMiles">Max miles</label><select id="maxMiles">'+[20000,30000,40000,50000].map(function(n){return'<option value="'+n+'"'+(state.miles===n?' selected':'')+'>'+miles(n)+'</option>'}).join("")+'</select></div>'+
'<label class="checkbox"><input id="approvedOnly" type="checkbox"'+(state.onlyApproved?" checked":"")+'> Manufacturer approved only</label>'+
'<label class="checkbox"><input id="includeExcluded" type="checkbox"'+(state.excluded?" checked":"")+'> Include excluded watchlist</label></div>'}
function filterResults(){var q=state.query.toLowerCase().trim();var base=state.page==="model"?all().filter(function(a){return a.model===state.model}):all();if(state.modelFilter&&state.page!=="model")base=base.filter(function(a){return a.model===state.modelFilter});base=base.filter(function(a){return (eligible(a)||state.excluded)&&a.price!==null&&(state.excluded&&!eligible(a)||a.price<=state.budget&&a.mileage<=state.miles)});if(state.onlyApproved)base=base.filter(function(a){return String(a.approved).toLowerCase()==="confirmed"});if(q)base=base.filter(function(a){return[a.model,a.trim,a.seller,a.location,a.registration,a.fit,a.evidence,a.priority,a.heatPump].join(" ").toLowerCase().includes(q)});base.sort(function(a,b){if(state.sort==="price")return a.price-b.price;if(state.sort==="miles")return a.mileage-b.mileage;if(state.sort==="newest")return b.year-a.year;if(state.sort==="range")return(b.wltp||0)-(a.wltp||0);return (a.selected===b.selected?0:a.selected?-1:1)||Number(eligible(b))-Number(eligible(a))||a.price-b.price});return base}
function adCard(a){var ex=!eligible(a),isApproved=String(a.approved).toLowerCase()==="confirmed",flag=ex?badge("Outside limits","red"):a.selected?badge("Best-match pick","blue"):a.priority.toLowerCase().includes("top")||a.priority.toLowerCase().includes("strong")?badge("Worth a look","green"):badge("Conditional","");
return'<article class="adcard"><div class="adtop"><div><div>'+flag+(isApproved?' '+badge("Manufacturer approved","green"):"")+'</div><h3>'+esc(a.model)+'</h3><div class="adtitle">'+esc(a.year+" · "+a.trim)+'</div></div><div style="text-align:right"><div class="adprice">'+money(a.price)+'</div><div class="tiny">'+miles(a.mileage)+'</div></div></div>'+
'<div class="adfacts"><span>'+esc(a.drivetrain||"Drivetrain unverified")+'</span>'+(a.wltp?'<span>'+a.wltp+' mi WLTP*</span>':"")+(a.boot?'<span>'+a.boot+'L boot*</span>':"")+'</div>'+
'<div class="adfeatures">'+metric(a,"Glass roof","glassRoof")+metric(a,"Heated steering","heatedWheel")+metric(a,"360° / parking","camera")+metric(a,"Adaptive cruise / lane","driverAssist")+'</div>'+
'<div class="seller">'+esc(a.seller||"Seller not confirmed")+(a.location&&a.location!=="UK; verify dealer"?" · "+esc(a.location):"")+' · Checked '+esc(a.checked||"date not recorded")+'</div>'+
'<div class="adfoot"><div class="inlineactions">'+(safeUrl(a.url)?'<a class="btn sm" href="'+esc(safeUrl(a.url))+'" target="_blank" rel="noopener noreferrer">View advert ↗</a>':"")+'<button type="button" class="btn outline sm" data-detail="'+esc(getKey(a))+'">Specs & caveats</button></div><button type="button" class="btn sm '+(chosen(a)?"secondary":"ghost")+'" data-compare="'+esc(getKey(a))+'">'+(chosen(a)?"✓ Added":"+ Compare")+'</button></div></article>'}
function renderListResults(){var items=filterResults();var count=document.getElementById("result-count");if(count)count.textContent=items.length+" results";var target=document.getElementById("list-results");if(target)target.innerHTML=items.length?items.slice(0,state.limit).map(adCard).join(""):'<div class="empty" style="grid-column:1/-1"><strong>No matching listings</strong>Try different filters or enable the excluded watchlist. Unresearched models may still have only a few seeded adverts.</div>';var more=document.getElementById("loadMore");if(more){more.classList.toggle("hide",state.limit>=items.length)}}
function listingsPage(){return'<section class="section"><div class="sectionhead"><div><h2>Search every listing</h2><p>Filter the vehicles we have already researched or recorded.</p></div></div>'+listingControls("all")+'<div class="splithead"><span id="result-count"></span><span>Prices are asking prices, not guaranteed availability</span></div><div class="listgrid" id="list-results"></div><div style="text-align:center;margin-top:15px"><button type="button" class="btn secondary hide" id="loadMore" data-load-more>Load more adverts</button></div></section>'}
function modelPage(){var m=state.data.models.find(function(x){return x.name===state.model});if(!m)return listingsPage();var ov=m.overview||{};var elig=m.listings.filter(eligible);return'<section class="section"><button type="button" class="backlink" data-nav="overview">← All models</button><div class="detailhead"><div class="flex"><div><div class="kicker">Cheap Car Comparisons / Model research</div><h2 class="page-title">'+esc(m.name)+'</h2><p>'+esc(ov.fit||"Detailed research not completed yet.")+'</p></div><div style="display:flex;gap:20px"><div class="pricecell"><small>Lowest asking</small><b>'+money(ov.lowestPrice)+'</b></div><div class="pricecell"><small>Best-match price</small><b class="blue">'+money(ov.bestPrice)+'</b></div></div></div><div class="pillrow"><span>'+elig.length+' qualifying/conditional adverts</span><span>'+esc(ov.stage||"Research pending")+'</span></div><p><b>Watch-outs:</b> '+esc(ov.caveat||"Confirm equipment and condition for every advert.")+'</p><p><b>Next step:</b> '+esc(ov.next||"Further model research")+'</p></div>'+
listingControls("model")+'<div class="splithead"><span id="result-count"></span><span>Tap “Specs & caveats” for individual evidence</span></div><div class="listgrid" id="list-results"></div><div style="text-align:center;margin-top:15px"><button type="button" class="btn secondary hide" id="loadMore" data-load-more>Load more adverts</button></div></section>'}
function comparePage(){var a=state.comparison.map(function(key){return all().find(function(x){return getKey(x)===key})}).filter(Boolean);if(!a.length)return'<section class="section"><div class="sectionhead"><div><h2>Side-by-side comparisons</h2><p>Pick up to four specific adverts to see which has the features you want.</p></div></div><div class="empty"><strong>No cars selected yet</strong>Browse listings, then tap “+ Compare” on up to four vehicles.<p><button type="button" class="btn" data-nav="listings">Browse listings</button></p></div></section>';
var fields=[["Price","price"],["Mileage","mileage"],["Year","year"],["Trim & battery","trim"],["Drivetrain","drivetrain"],["Glass roof","glassRoof"],["Heated steering wheel","heatedWheel"],["Heated seats","heatedSeats"],["360° / parking","camera"],["Adaptive cruise / lane","driverAssist"],["Heat pump","heatPump"],["WLTP claimed range","wltp"],["Boot capacity","boot"],["Manufacturer approved?","approved"],["Seller","seller"],["Gaps / checks","checks"]];
return'<section class="section"><div class="sectionhead"><div><h2>Side-by-side comparisons</h2><p>Comparing '+a.length+' specific adverts. The spec notes preserve uncertainty where evidence is missing.</p></div><button class="btn secondary sm" type="button" data-clear-compare>Clear comparison</button></div><div class="cmpwrap"><table class="cmptable"><thead><tr><th>Specification</th>'+a.map(function(x){return'<th><div class="cmphead">'+esc(x.model)+'</div><div class="note">'+esc(x.trim)+'</div><button type="button" class="actionlink" data-compare="'+esc(getKey(x))+'">Remove ×</button></th>'}).join("")+'</tr></thead><tbody>'+
fields.map(function(f){return'<tr><td>'+esc(f[0])+'</td>'+a.map(function(x){var v=x[f[1]];if(f[1]==="price")v=money(v);else if(f[1]==="mileage")v=miles(v);else if(f[1]==="wltp")v=v?String(v)+" miles*":"Not verified";else if(f[1]==="boot")v=v?String(v)+" litres*":"Not verified";return'<td>'+esc(v===null||v===""?"Not verified":v)+'</td>'}).join("")+'</tr>'}).join("")+
'<tr><td>Original advert</td>'+a.map(function(x){return'<td>'+(safeUrl(x.url)?'<a class="actionlink" href="'+esc(safeUrl(x.url))+'" target="_blank" rel="noopener noreferrer">Open advert ↗</a>':"Not available")+'</td>'}).join("")+'</tr></tbody></table></div><div class="note">*WLTP/boot figures are approximate trim-level research values. Verify the exact vehicle and model year.</div></section>'}
function detailModal(key){var a=all().find(function(x){return getKey(x)===key});if(!a)return;var dialog=document.getElementById("detailDialog");if(dialog)dialog.remove();
var d=document.createElement("dialog");d.id="detailDialog";d.style.cssText="width:min(660px,calc(100vw - 20px));max-height:88vh;border:1px solid #dae3ee;border-radius:18px;padding:0;box-shadow:0 25px 90px #0d223f55;background:#fff;color:#152139";
d.innerHTML='<div style="padding:20px 22px;overflow:auto;max-height:86vh"><div style="display:flex;justify-content:space-between;gap:15px;align-items:start"><div><div class="kicker">Vehicle evidence card</div><h2 style="font:800 23px Manrope;letter-spacing:-.05em;margin:6px 0">'+esc(a.model)+'</h2><div class="note">'+esc(a.year+" · "+a.trim+" · "+a.registration)+'</div></div><button class="btn ghost sm" data-close-dialog>Close ×</button></div><div style="font:800 29px Manrope;letter-spacing:-.05em;margin:12px 0">'+money(a.price)+' <small style="font:600 12px DM Sans;color:#6d7b90">'+miles(a.mileage)+'</small></div>'+
'<div class="adfeatures">'+metric(a,"Glass roof","glassRoof")+metric(a,"Heated steering wheel","heatedWheel")+metric(a,"Heated seats","heatedSeats")+metric(a,"360° / parking","camera")+metric(a,"Adaptive cruise / lane","driverAssist")+metric(a,"Heat pump","heatPump")+'</div>'+
'<h3 style="font:800 14px Manrope;margin:20px 0 6px">What the advert supports</h3><p class="note" style="font-size:12px">'+esc(a.evidence||"No independent feature evidence recorded.")+'</p><h3 style="font:800 14px Manrope;margin:20px 0 6px">Outstanding checks</h3><p class="note" style="font-size:12px">'+esc(a.checks||"Verify equipment, history and ownership details.")+'</p><div class="pillrow">'+badge(a.approved==="Confirmed"?"Manufacturer approval indicated":"Manufacturer approval not confirmed",a.approved==="Confirmed"?"green":"amber")+' '+badge(a.priority,/EXCLUDED/.test(a.priority)?"red":"blue")+'</div>'+
'<div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:22px"><button type="button" class="btn secondary" data-compare="'+esc(getKey(a))+'">'+(chosen(a)?"Remove from compare":"Add to compare")+'</button>'+(safeUrl(a.url)?'<a class="btn" href="'+esc(safeUrl(a.url))+'" rel="noopener noreferrer" target="_blank">Open advert ↗</a>':"")+'</div></div>';document.body.appendChild(d);d.addEventListener("click",function(ev){if(ev.target===d)d.close()});d.addEventListener("close",function(){d.remove()});d.showModal()}
function footer(){var date=state.data?.generatedAt?new Date(state.data.generatedAt).toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short",timeZone:"Europe/London"}):"Unknown";
return'<footer class="footer"><div><b>Cheap Car Comparisons</b> · A research dashboard, not a car retailer.<br>Published snapshot: '+esc(date)+' UK time. Individual adverts may have changed or sold.</div><div><a href="'+esc(SOURCE_SHEET)+'" target="_blank" rel="noopener noreferrer">Private Google Sheet ↗</a> &nbsp; <button type="button" class="actionlink" data-reload>Check for published updates ↻</button></div></footer>'}
function tray(){var el=document.getElementById("compare-tray");if(!state.comparison.length){el.innerHTML="";return}el.innerHTML='<div class="tray"><div><strong>'+state.comparison.length+' car'+(state.comparison.length===1?"":"s")+' selected</strong><small>Compare their actual advertised equipment</small></div><div class="inlineactions"><button type="button" class="btn secondary sm" data-clear-compare>Clear</button><button type="button" class="btn sm" data-nav="compare">Compare →</button></div></div>'}
function render(){if(!state.data)return;root.innerHTML=(state.page==="overview"?overviewPage():state.page==="compare"?comparePage():state.page==="model"?modelPage():listingsPage())+footer();document.querySelectorAll("[data-nav]").forEach(function(el){if(el.classList.contains("navbutton"))el.classList.toggle("active",el.dataset.nav===state.page||(state.page==="model"&&el.dataset.nav==="listings"))});document.getElementById("nav-compare-count").textContent=state.comparison.length?"("+state.comparison.length+")":"";if(state.page==="listings"||state.page==="model")renderListResults();tray()}
function navigate(page){state.page=page;state.limit=24;state.query="";state.modelFilter="";state.excluded=false;window.scrollTo({top:0,behavior:"smooth"});render()}
function load(){root.innerHTML='<div class="loader">Loading the latest published spreadsheet data…</div>';return fetch("./data.json?fresh="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("Data endpoint returned HTTP "+r.status);return r.json()}).then(function(d){if(!Array.isArray(d.models)||!d.models.length)throw Error("The data file is empty");state.data=d;var saved=[];try{saved=JSON.parse(localStorage.getItem("cheap-cars-compare-v1")||"[]")}catch(e){}state.comparison=saved.filter(function(k){return all().some(function(x){return getKey(x)===k})}).slice(0,4);render()}).catch(function(e){root.innerHTML='<div class="errorbox"><h2>Could not load the comparison data</h2><p>'+esc(e.message)+'</p><p>Try refreshing, or check <a href="./data.json">the public data file</a>. The private Google Sheet itself is not exposed.</p><button class="btn" data-reload>Try again</button></div>'})}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-nav],[data-model],[data-detail],[data-compare],[data-clear-compare],[data-reload],[data-load-more],[data-close-dialog]");
 if(!t)return;
 if(t.hasAttribute("data-nav")){navigate(t.dataset.nav);return}
 if(t.hasAttribute("data-model")){state.model=t.dataset.model;navigate("model");return}
 if(t.hasAttribute("data-detail")){detailModal(t.dataset.detail);return}
 if(t.hasAttribute("data-close-dialog")){document.getElementById("detailDialog")?.close();return}
 if(t.hasAttribute("data-compare")){var k=t.dataset.compare;var i=state.comparison.indexOf(k);if(i>=0)state.comparison.splice(i,1);else if(state.comparison.length>=4){alert("Compare up to four cars at once.");return}else state.comparison.push(k);try{localStorage.setItem("cheap-cars-compare-v1",JSON.stringify(state.comparison))}catch(e){}render();var dialog=document.getElementById("detailDialog");if(dialog)dialog.close();return}
 if(t.hasAttribute("data-clear-compare")){state.comparison=[];try{localStorage.removeItem("cheap-cars-compare-v1")}catch(e){}render();return}
 if(t.hasAttribute("data-reload")){load();return}
 if(t.hasAttribute("data-load-more")){state.limit+=24;renderListResults();return}
});
document.addEventListener("keydown",function(e){var t=e.target.closest("[data-model][role='button']");if(t&&(e.key==="Enter"||e.key===" ")){e.preventDefault();state.model=t.dataset.model;navigate("model")}});
document.addEventListener("input",function(ev){if(ev.target.id==="searchBox"){state.query=ev.target.value;state.limit=24;renderListResults()}});
document.addEventListener("change",function(ev){var id=ev.target.id;switch(id){case"sortPicker":state.sort=ev.target.value;break;case"modelPicker":state.modelFilter=ev.target.value;break;case"maxPrice":state.budget=Number(ev.target.value);break;case"maxMiles":state.miles=Number(ev.target.value);break;case"approvedOnly":state.onlyApproved=ev.target.checked;break;case"includeExcluded":state.excluded=ev.target.checked;break;default:return}state.limit=24;renderListResults()});
load();
})();
</script>
</body></html>
