<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pages</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e7eaf0;--accent:#4f46e5}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:900px;margin:0 auto;padding:64px 22px}.hero{margin-bottom:28px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-.04em;margin:10px 0 12px}.sub{color:var(--muted);font-size:18px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;text-decoration:none;color:inherit;box-shadow:0 8px 24px rgba(23,32,51,.05);transition:.15s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(23,32,51,.09)}.card h2{margin:0 0 8px;font-size:20px}.card p{margin:0;color:var(--muted);line-height:1.5}.path{margin-top:14px;font-size:12px;color:var(--accent);font-weight:700}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">Mahmoud's pages</div>
      <h1>Shareable pages</h1>
      <div class="sub">A small collection of standalone pages and comparisons.</div>
    </section>
    <section class="grid">
      <a class="card" href="./nursery-comparison/">
        <h2>MK5 Nursery Comparison</h2>
        <p>Neutral side-by-side comparison of Acorn Shenley, Ducklings SBE and Oxley Park.</p>
        <div class="path">/nursery-comparison/ →</div>
      </a>
    </section>
  </main>
</body>
</html>
